<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-tapete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D223A" />
      <stop offset="100%" stop-color="#06111F" />
    </linearGradient>
    <pattern id="rug-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4" />
      <circle cx="20" cy="20" r="4" fill="#38BDF8" opacity="0.5" />
      <path d="M 0 0 L 10 10 M 30 10 L 40 0 M 30 30 L 40 40 M 0 40 L 10 30" stroke="#D4AF37" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Fundo do Tapete Texturizado -->
  <rect width="600" height="420" fill="url(#bg-tapete)" />
  <rect width="600" height="420" fill="url(#rug-pattern)" />

  <!-- Borda Nobre de Tapete Clássico / Persa -->
  <rect x="25" y="25" width="550" height="370" rx="4" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.7" />
  <rect x="35" y="35" width="530" height="350" rx="2" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.4" />
  
  <!-- Medalhão Central de Tapete Oriental Lavado e Restaurado -->
  <g transform="translate(300, 210)">
    <!-- Aura e Florão Central -->
    <circle cx="0" cy="0" r="105" fill="#0D223A" stroke="#D4AF37" stroke-width="2" opacity="0.9" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="60" fill="#153252" stroke="#D4AF37" stroke-width="1" />
    
    <!-- Pétalas e Grafismos Nobres -->
    <path d="M 0 -50 L 15 -15 L 50 0 L 15 15 L 0 50 L -15 15 L -50 0 L -15 -15 Z" fill="#D4AF37" opacity="0.8" />
    <circle cx="0" cy="0" r="15" fill="#06111F" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="6" fill="#D4AF37" />
  </g>

  <!-- Franjas Impecáveis e Limpas nas Pontas -->
  <g stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="15" y1="20" x2="25" y2="20" /><line x1="15" y1="40" x2="25" y2="40" />
    <line x1="15" y1="60" x2="25" y2="60" /><line x1="15" y1="80" x2="25" y2="80" />
    <line x1="15" y1="100" x2="25" y2="100" /><line x1="15" y1="120" x2="25" y2="120" />
    <line x1="15" y1="140" x2="25" y2="140" /><line x1="15" y1="160" x2="25" y2="160" />
    <line x1="15" y1="180" x2="25" y2="180" /><line x1="15" y1="200" x2="25" y2="200" />
    <line x1="15" y1="220" x2="25" y2="220" /><line x1="15" y1="240" x2="25" y2="240" />
    <line x1="15" y1="260" x2="25" y2="260" /><line x1="15" y1="280" x2="25" y2="280" />
    <line x1="15" y1="300" x2="25" y2="300" /><line x1="15" y1="320" x2="25" y2="320" />
    <line x1="15" y1="340" x2="25" y2="340" /><line x1="15" y1="360" x2="25" y2="360" />
    <line x1="15" y1="380" x2="25" y2="380" /><line x1="15" y1="400" x2="25" y2="400" />

    <line x1="575" y1="20" x2="585" y2="20" /><line x1="575" y1="40" x2="585" y2="40" />
    <line x1="575" y1="60" x2="585" y2="60" /><line x1="575" y1="80" x2="585" y2="80" />
    <line x1="575" y1="100" x2="585" y2="100" /><line x1="575" y1="120" x2="585" y2="120" />
    <line x1="575" y1="140" x2="585" y2="140" /><line x1="575" y1="160" x2="585" y2="160" />
    <line x1="575" y1="180" x2="585" y2="180" /><line x1="575" y1="200" x2="585" y2="200" />
    <line x1="575" y1="220" x2="585" y2="220" /><line x1="575" y1="240" x2="585" y2="240" />
    <line x1="575" y1="260" x2="585" y2="260" /><line x1="575" y1="280" x2="585" y2="280" />
    <line x1="575" y1="300" x2="585" y2="300" /><line x1="575" y1="320" x2="585" y2="320" />
    <line x1="575" y1="340" x2="585" y2="340" /><line x1="575" y1="360" x2="585" y2="360" />
    <line x1="575" y1="380" x2="585" y2="380" /><line x1="575" y1="400" x2="585" y2="400" />
  </g>
</svg>

