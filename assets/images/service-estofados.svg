<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-estofados" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="sofa-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="cushion-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D223A" />
    </linearGradient>
    <linearGradient id="cushion-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- Fundo do Ambiente Sala / Studio -->
  <rect width="600" height="420" fill="url(#bg-estofados)" />
  
  <!-- Parede Minimalista e Rodapé -->
  <line x1="0" y1="360" x2="600" y2="360" stroke="#CBD5E1" stroke-width="2" />
  <rect x="0" y="360" width="600" height="60" fill="#E2E8F0" opacity="0.5" />

  <!-- Sofá Moderno / Estofado Impecável Higienizado -->
  <g transform="translate(60, 110)">
    <!-- Encosto do Sofá -->
    <rect x="20" y="30" width="440" height="150" rx="16" fill="url(#sofa-fabric)" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Costuras Verticais de Estofado Nobre -->
    <line x1="130" y1="30" x2="130" y2="180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="240" y1="30" x2="240" y2="180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="350" y1="30" x2="350" y2="180" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Almofadas do Assento -->
    <rect x="15" y="145" width="220" height="85" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="245" y="145" width="220" height="85" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Braço Esquerdo -->
    <rect x="0" y="100" width="45" height="135" rx="12" fill="url(#sofa-fabric)" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Braço Direito -->
    <rect x="435" y="100" width="45" height="135" rx="12" fill="url(#sofa-fabric)" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Pés de Madeira / Metal do Sofá -->
    <polygon points="35,235 45,235 50,265 30,265" fill="#0D223A" />
    <polygon points="445,235 455,235 460,265 440,265" fill="#0D223A" />
    <polygon points="235,235 245,235 245,265 235,265" fill="#0D223A" />

    <!-- Almofada Decorativa Azul Marinho -->
    <g transform="translate(60, 105) rotate(-8)">
      <rect x="0" y="0" width="85" height="85" rx="14" fill="url(#cushion-blue)" stroke="#06111F" stroke-width="1" />
      <circle cx="42" cy="42" r="4" fill="#38BDF8" />
    </g>

    <!-- Almofada Decorativa Bege / Neutra -->
    <g transform="translate(115, 120) rotate(5)">
      <rect x="0" y="0" width="75" height="75" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    </g>

    <!-- Brilho / Frescor de Higienização Profunda -->
    <g transform="translate(360, 60)" opacity="0.85">
      <path d="M 15 0 L 19 11 L 30 15 L 19 19 L 15 30 L 11 19 L 0 15 L 11 11 Z" fill="#38BDF8" />
      <circle cx="40" cy="5" r="3" fill="#D4AF37" />
    </g>
  </g>
</svg>

