<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" height="100%" fill="none">
  <defs>
    <clipPath id="hero-curve-clip">
      <path d="M 0 30 C 180 -10, 460 -10, 640 40 L 640 520 L 0 520 Z" />
    </clipPath>
    <linearGradient id="soft-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FB" />
      <stop offset="100%" stop-color="#E8F1F7" />
    </linearGradient>
    <linearGradient id="towel-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D223A" />
      <stop offset="100%" stop-color="#071424" />
    </linearGradient>
    <linearGradient id="towel-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A88" />
      <stop offset="100%" stop-color="#1B3A5C" />
    </linearGradient>
    <linearGradient id="towel-grey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="towel-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="card-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0D223A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Ambient Shape -->
  <g filter="url(#card-shadow)">
    <rect x="15" y="15" width="610" height="490" rx="16" fill="url(#soft-bg-grad)" />
  </g>

  <!-- Organic Arc Line (Identidade do Mockup) -->
  <path d="M 380 15 Q 520 120 625 320" stroke="#C59B27" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.45" />

  <!-- Background Laundry Elements (Ambiente Moderno e Impecável) -->
  <g opacity="0.85">
    <!-- Linha de Fundo Superior (Azulejos / Parede Editorial) -->
    <rect x="40" y="40" width="560" height="190" rx="10" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Máquinas de Lavar Profissionais no Fundo -->
    <g transform="translate(360, 60)">
      <!-- Máquina 1 -->
      <rect x="0" y="0" width="105" height="145" rx="8" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="52" cy="72" r="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
      <circle cx="52" cy="72" r="30" fill="#0D223A" opacity="0.12" />
      <circle cx="52" cy="72" r="22" fill="#38BDF8" opacity="0.2" />
      <rect x="12" y="12" width="40" height="10" rx="2" fill="#94A3B8" />
      <circle cx="85" cy="17" r="4" fill="#38BDF8" />
      
      <!-- Máquina 2 -->
      <rect x="120" y="0" width="105" height="145" rx="8" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="172" cy="72" r="38" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
      <circle cx="172" cy="72" r="30" fill="#0D223A" opacity="0.12" />
      <circle cx="172" cy="72" r="22" fill="#38BDF8" opacity="0.2" />
      <rect x="132" y="12" width="40" height="10" rx="2" fill="#94A3B8" />
      <circle cx="205" cy="17" r="4" fill="#38BDF8" />
    </g>

    <!-- Flores / Vaso Editorial de Lírios Brancos (Toque de Cuidado e Perfume) -->
    <g transform="translate(245, 55)">
      <!-- Vaso de vidro minimalista -->
      <rect x="35" y="65" width="30" height="70" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="0.8" />
      <rect x="38" y="90" width="24" height="40" rx="2" fill="#38BDF8" opacity="0.2" />
      <!-- Hastes e Flores -->
      <path d="M 50 65 Q 40 30 30 10" stroke="#475569" stroke-width="2" fill="none" />
      <path d="M 50 65 Q 50 25 55 5" stroke="#475569" stroke-width="2" fill="none" />
      <path d="M 50 65 Q 65 35 75 15" stroke="#475569" stroke-width="2" fill="none" />
      <!-- Pétalas brancas -->
      <path d="M 30 10 Q 15 5 25 20 Q 35 15 30 10 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <path d="M 55 5 Q 45 -5 60 -2 Q 65 10 55 5 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <path d="M 75 15 Q 85 5 80 25 Q 70 20 75 15 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    </g>

    <!-- Cabideiro com Roupas Alinhadas no Fundo -->
    <g transform="translate(60, 65)">
      <line x1="10" y1="15" x2="160" y2="15" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
      <!-- Camisa 1 (Branca) -->
      <path d="M 30 15 L 15 45 L 25 125 L 55 125 L 45 45 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <!-- Camisa 2 (Azul Claro) -->
      <path d="M 65 15 L 50 45 L 60 130 L 90 130 L 80 45 Z" fill="#E8F4FA" stroke="#BAE6FD" stroke-width="1" />
      <!-- Camisa 3 (Azul Marinho) -->
      <path d="M 100 15 L 85 45 L 95 128 L 125 128 L 115 45 Z" fill="#0D223A" opacity="0.8" stroke="#153252" stroke-width="1" />
      <!-- Camisa 4 (Branca) -->
      <path d="M 135 15 L 120 45 L 130 125 L 160 125 L 150 45 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    </g>
  </g>

  <!-- Foreground: Pilha de Toalhas Macias e Impecáveis Dobradas -->
  <g transform="translate(250, 200)">
    <!-- Toalha 1 (Base - Branca Grande) -->
    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="340" height="46" rx="10" fill="url(#towel-white)" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M 10 23 Q 170 30 330 23" stroke="#CBD5E1" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Toalha 2 (Cinza Claro / Bege Neutro) -->
    <g transform="translate(15, 90)">
      <rect x="0" y="0" width="315" height="44" rx="10" fill="url(#towel-grey)" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 10 22 Q 155 28 305 22" stroke="#94A3B8" stroke-width="1" opacity="0.5" />
    </g>

    <!-- Toalha 3 (Azul Petróleo / Claro) -->
    <g transform="translate(28, 48)">
      <rect x="0" y="0" width="290" height="42" rx="10" fill="url(#towel-blue)" stroke="#1B3A5C" stroke-width="1.5" />
      <path d="M 10 21 Q 145 27 280 21" stroke="#38BDF8" stroke-width="1" opacity="0.4" />
    </g>

    <!-- Toalha 4 (Topo - Azul-Marinho Profundo da Marca Bordada) -->
    <g transform="translate(42, 6)">
      <rect x="0" y="0" width="265" height="42" rx="10" fill="url(#towel-navy)" stroke="#153252" stroke-width="1.5" />
      
      <!-- Bordado Elegante LORD'S LAVANDERIA -->
      <g transform="translate(85, 8) scale(0.65)">
        <!-- Coroa Dourada Bordada -->
        <path d="M 52 4 L 56 12 L 63 7 L 70 16 L 42 16 L 48 7 Z" fill="#D4AF37" />
        <circle cx="48" cy="6" r="1.5" fill="#D4AF37" />
        <circle cx="56" cy="3" r="1.8" fill="#D4AF37" />
        <circle cx="63" cy="6" r="1.5" fill="#D4AF37" />
        <!-- Nome Bordado -->
        <text x="56" y="27" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="1">LORD'S</text>
        <text x="56" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="bold" fill="#38BDF8" letter-spacing="2.5">LAVANDERIA</text>
      </g>
    </g>
  </g>

  <!-- Tag de Qualidade / Selo de Cuidado (Microelemento de Apoio) -->
  <g transform="translate(50, 275)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="185" height="72" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(16, 16)">
      <circle cx="20" cy="20" r="20" fill="#FEF8E7" />
      <!-- Ícone Coroa -->
      <path d="M 12 25 L 16 16 L 20 21 L 24 13 L 28 21 L 32 16 L 36 25 Z" fill="#C59B27" />
    </g>
    <text x="64" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#C59B27" letter-spacing="0.5">PADRÃO PREMIUM</text>
    <text x="64" y="49" font-family="'DM Serif Display', Georgia, serif" font-size="15" fill="#0D223A">Cuidado Artesanal</text>
  </g>

  <!-- Tag Secundária: Higienização & Frescor -->
  <g transform="translate(70, 365)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="165" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="16" fill="#E8F4FA" />
      <!-- Ícone Gota/Frescor -->
      <path d="M 16 9 C 13 14 10 17 10 20 C 10 23.3 12.7 26 16 26 C 19.3 26 22 23.3 22 20 C 22 17 19 14 16 9 Z" fill="#38BDF8" />
    </g>
    <text x="54" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="0.5">PERFUME &amp; TOQUE</text>
    <text x="54" y="44" font-family="'DM Serif Display', Georgia, serif" font-size="13" fill="#0D223A">Peças Impecáveis</text>
  </g>
</svg>

